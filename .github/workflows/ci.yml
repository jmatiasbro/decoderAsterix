name: CI — tests y cobertura SWAL 2

# Ejecuta la suite y mide cobertura de decisiones sobre los módulos SWAL 2
# (redes de seguridad + ciclo de vida + correlación). Evidencia reproducible
# para verificación DO-278A / ED-109A (cierra RNC-007). Ver 09_SVP.md §4.4.

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Bibliotecas de sistema que PyQt6 necesita en modo offscreen (sin display).
      - name: Dependencias de sistema (Qt offscreen)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libglib2.0-0 \
            libfontconfig1 libfreetype6

      - name: Dependencias Python
        run: |
          python -m pip install --upgrade pip
          # Conjunto mínimo para la suite (el núcleo es agnóstico a Qt; PyQt6 solo
          # se usa vía fixture offscreen). asterix==0.2.4 provee la extensión nativa.
          pip install PyQt6 pyproj duckdb scapy dpkt asterix==0.2.4 \
                      pytest pytest-cov pytest-html

      - name: Ejecutar suite completa
        run: |
          python -m pytest tests/ -q --tb=short \
            --html=coverage/pytest-report.html --self-contained-html

      - name: Cobertura de decisiones (módulos SWAL 2, objetivo >= 80 %)
        run: |
          python -m pytest tests/ -q \
            --cov=player/tracking --cov=player/areas --cov=player/msaw \
            --cov=analysis/stca_analyzer --cov=fusion/correlator \
            --cov-config=.coveragerc \
            --cov-report=term --cov-report=html:coverage/htmlcov \
            --cov-report=xml:coverage/coverage.xml

      - name: Publicar reportes (cobertura + resultados)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-verificacion
          path: coverage/
          retention-days: 90
