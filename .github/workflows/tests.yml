name: tests

# CI de verificación (DO-278A objetivos V-5/V-6): ejecuta la suite pytest y mide
# cobertura estructural en cada push/PR. Evidencia reproducible para certificación.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen   # GUI headless: evita requerir display X
      PYTHONUTF8: "1"              # evita UnicodeEncodeError con emojis en logs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias de sistema para PyQt6
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-linux.txt || pip install -r requirements.txt
          pip install PyQt6 pyproj duckdb pytest pytest-cov

      - name: Linter del estándar SWAL 2 (doc 13 §7)
        # Control mecánico de regresión de las prohibiciones duras (EC-5/6/7) sobre
        # los módulos de seguridad. Falla el pipeline si se introduce time.time(),
        # import de PyQt6 o import * en el núcleo SWAL 2. Cierra D-4 (linter en CI).
        run: python tools/lint_swal2.py

      - name: Ejecutar suite con cobertura
        # El scope y el gate (fail_under=80) de la cobertura de DECISIONES sobre los
        # módulos SWAL 2 los fija .coveragerc ([report] include). La medición amplia
        # de abajo se acota allí a las 9 unidades de seguridad. Ver 09_SVP.md §4.4.
        run: |
          pytest tests/ \
            --cov=decoder --cov=player --cov=analysis --cov=fusion --cov=storage \
            --cov-report=term-missing --cov-report=xml \
            --cov-report=html:htmlcov

      - name: Publicar reportes de cobertura (xml + html)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-cobertura
          path: |
            coverage.xml
            htmlcov/
          retention-days: 90
